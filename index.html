<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KörperJa Freude-Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --sun-core:#FFC857;
    --sun-glow:#FFE1A8;
    --coral:#F4805A;
    --terracotta:#E8641C;
    --cream:#FFF6EC;
    --card:#FFEAD6;
    --brown:#3D2317;
    --brown-soft:#6B4A34;
    --rose:#FFD9B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;
    background: radial-gradient(circle at 50% -10%, var(--sun-glow) 0%, var(--cream) 45%, #FFEFDD 100%);
    color:var(--brown);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  h1,h2,h3,.logo,.headline{
    font-family:'Fredoka',sans-serif;
  }

  /* --- header / sun signature --- */
  .brandbar{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
    position:relative;
  }
  .sun{
    width:64px;height:64px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFF6DC 0%, var(--sun-core) 45%, var(--coral) 100%);
    box-shadow: 0 0 0 8px rgba(255,200,87,0.18), 0 0 40px 6px rgba(244,128,90,0.35);
    animation: pulse 4s ease-in-out infinite;
    margin-bottom:10px;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); box-shadow: 0 0 0 8px rgba(255,200,87,0.18), 0 0 40px 6px rgba(244,128,90,0.35);}
    50%{ transform:scale(1.06); box-shadow: 0 0 0 12px rgba(255,200,87,0.24), 0 0 55px 10px rgba(244,128,90,0.45);}
  }
  .logo{
    font-size:28px;
    font-weight:700;
    letter-spacing:0.5px;
    background: linear-gradient(90deg, var(--terracotta), var(--coral));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{
    font-size:14px;
    color:var(--brown-soft);
    margin-top:2px;
    text-align:center;
  }

  /* --- card shell --- */
  .card-shell{
    background:#fff;
    border-radius:28px;
    padding:32px 26px;
    box-shadow: 0 18px 40px -14px rgba(232,100,28,0.25);
    position:relative;
    overflow:hidden;
  }
  .card-shell::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px;height:140px;border-radius:50%;
    background: radial-gradient(circle, var(--rose) 0%, transparent 70%);
    opacity:.7;
  }

  /* --- progress dots --- */
  .progress{
    display:flex; gap:6px; justify-content:center; margin-bottom:22px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#F4D9C0;
    transition: all .25s ease;
  }
  .dot.active{ background:var(--coral); width:22px; border-radius:5px;}
  .dot.done{ background:var(--sun-core); }

  /* --- step content --- */
  .step-title{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--brown);
  }
  .step-sub{
    font-size:14px;
    color:var(--brown-soft);
    margin:0 0 20px;
    line-height:1.5;
  }

  .options{
    display:flex; flex-direction:column; gap:10px;
  }
  .opt{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border-radius:16px;
    border:2px solid #F4E3D2;
    background:#FFFBF6;
    cursor:pointer;
    transition: all .15s ease;
    font-size:15px;
    font-weight:500;
    text-align:left;
  }
  .opt:hover{ border-color:var(--sun-core); background:#FFF6E8;}
  .opt.selected{
    border-color:var(--coral);
    background: linear-gradient(90deg, #FFF1E6, #FFE7D6);
    box-shadow: 0 4px 14px -6px rgba(244,128,90,0.5);
  }
  .opt .em{ font-size:20px; }
  .opt small{ display:block; font-weight:400; color:var(--brown-soft); font-size:12.5px; margin-top:2px;}

  .grid-2{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }

  select, input[type=text]{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:2px solid #F4E3D2;
    background:#FFFBF6;
    font-family:'Quicksand',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--brown);
    appearance:none;
    -webkit-appearance:none;
  }
  select:focus, input:focus{ outline:none; border-color:var(--coral);}

  .field-label{
    font-size:13px;
    font-weight:700;
    color:var(--brown-soft);
    margin-bottom:6px;
    display:block;
  }

  /* --- buttons --- */
  .btn-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:26px; gap:10px;
  }
  .btn{
    font-family:'Fredoka',sans-serif;
    border:none;
    border-radius:999px;
    padding:13px 26px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background: linear-gradient(90deg, var(--coral), var(--terracotta));
    color:#fff;
    box-shadow: 0 8px 20px -8px rgba(232,100,28,0.6);
  }
  .btn-primary:disabled{
    opacity:.4; cursor:not-allowed; box-shadow:none;
  }
  .btn-ghost{
    background:transparent;
    color:var(--brown-soft);
    padding:13px 14px;
  }
  .btn-skip{
    background:#FFF1E6;
    color:var(--terracotta);
  }

  /* --- loading --- */
  .loading{
    text-align:center; padding:60px 10px;
  }
  .spinner{
    width:52px;height:52px;margin:0 auto 20px;
    border-radius:50%;
    border:5px solid #F4E3D2;
    border-top-color:var(--coral);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .loading p{ color:var(--brown-soft); font-weight:600; }
  .loading .loading-percent{
    font-family:'Fredoka',sans-serif; font-size:32px; font-weight:600;
    color:var(--coral); margin:4px 0 14px;
  }
  .progress-bar-track{
    width:100%; max-width:280px; height:10px; margin:0 auto 16px;
    background:#F4E3D2; border-radius:999px; overflow:hidden;
  }
  .progress-bar-fill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--coral), var(--sun-core));
    width:0%;
    transition: width .35s ease;
  }
  .loading .loading-hint{ font-weight:400; font-size:13px; margin-top:4px; }

  /* --- results --- */
  #result-capture{ background:transparent; }
  .result-intro{
    font-size:15.5px; line-height:1.7; margin-bottom:22px;
    background: var(--card);
    padding:18px 20px; border-radius:18px;
  }
  .section-card{
    background:#fff;
    border:2px solid #F7E5D2;
    border-radius:20px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .section-card h3{
    margin:0 0 8px; font-size:17px; display:flex; gap:8px; align-items:center;
  }
  .section-card p{ margin:0; font-size:14.5px; line-height:1.65; color:var(--brown);}

  .codes-heading{
    font-size:18px; font-weight:700; margin:26px 0 12px; text-align:center;
  }
  .codes-grid{
    display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:22px;
  }
  .code-card{
    background: linear-gradient(135deg, #FFF1E0, var(--rose));
    border-radius:16px;
    padding:14px 16px;
    font-size:14.5px;
    font-weight:600;
    line-height:1.5;
  }

  .empfehlung{
    background: linear-gradient(135deg, var(--terracotta), var(--coral));
    color:#fff;
    border-radius:20px;
    padding:20px 22px;
    font-size:15px; line-height:1.65;
    margin-bottom:22px;
  }
  .empfehlung strong{ display:block; font-family:'Fredoka',sans-serif; font-size:16px; margin-bottom:6px;}

  .closing{
    text-align:center; font-size:14.5px; line-height:1.7; color:var(--brown-soft);
    margin-bottom:20px;
  }
  .links{
    display:flex; flex-direction:column; gap:10px; align-items:center; margin-bottom:6px;
  }
  .links a{
    color:var(--terracotta); font-weight:700; text-decoration:none;
    background:#FFF1E6; padding:10px 20px; border-radius:999px; font-size:14px;
  }

  .action-row{
    display:flex; gap:10px; margin-top:22px;
  }
  .action-row .btn{ flex:1; }

  /* --- image export modal --- */
  .img-overlay{
    position:fixed; inset:0; background:rgba(61,35,23,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:1000;
  }
  .img-modal{
    background:#fff; border-radius:24px; padding:22px;
    max-width:420px; width:100%; max-height:90vh; overflow-y:auto;
    text-align:center;
  }
  .img-modal img{
    width:100%; border-radius:16px; margin-bottom:14px;
    border:2px solid #F4E3D2;
  }
  .img-modal p{
    font-size:13px; color:var(--brown-soft); margin:0 0 14px; line-height:1.5;
  }
  .img-modal .btn{ width:100%; margin-bottom:8px; text-decoration:none; display:inline-block; }

  .error-box{
    background:#FFE7E0; color:#A6371F; padding:16px 18px; border-radius:16px; font-size:14px; margin-bottom:16px;
  }

  @media (max-width:420px){
    .grid-2{ grid-template-columns:1fr; }
    .card-shell{ padding:26px 18px; border-radius:22px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brandbar">
    <div class="sun"></div>
    <div class="logo">KörperJa</div>
    <div class="tagline">Finde deinen persönlichen Freude-Code</div>
  </div>

  <div class="card-shell" id="card-shell"></div>
</div>

<script>
/* ================= DATA ================= */
const ZODIAC = [
  {v:"Widder", em:"♈"}, {v:"Stier", em:"♉"}, {v:"Zwillinge", em:"♊"}, {v:"Krebs", em:"♋"},
  {v:"Löwe", em:"♌"}, {v:"Jungfrau", em:"♍"}, {v:"Waage", em:"♎"}, {v:"Skorpion", em:"♏"},
  {v:"Schütze", em:"♐"}, {v:"Steinbock", em:"♑"}, {v:"Wassermann", em:"♒"}, {v:"Fische", em:"♓"}
];

const STRATEGIEN = [
  {v:"Ja, ich bin Generator – ich reagiere auf das Leben", em:"⚡"}
];

const AUTORITAETEN = [
  {v:"Sakrale Autorität (Bauchgefühl im Moment)", em:"🌀"},
  {v:"Emotionale Autorität (Welle abwarten)", em:"🌊"}
];

const SAKRALTORE = [
  {v:"3 – Mutation (Ordnung aus Chaos)"},
  {v:"5 – Fixe Rhythmen (Verlässlichkeit)"},
  {v:"9 – Fokus (Konzentration aufs Wesentliche)"},
  {v:"14 – Kraft der Fertigkeiten (Wohlstand durch Hingabe)"},
  {v:"27 – Fürsorge (Nähren & Versorgen)"},
  {v:"29 – Hingabe (das tiefe Ja-Sagen)"},
  {v:"34 – Kraft (pure Vitalität)"},
  {v:"42 – Wachstum (Zyklen vollenden)"},
  {v:"59 – Intimität (Verbindung schaffen)"}
];

const PROFILE = ["1/3","1/4","2/4","2/5","3/5","3/6","4/6","4/1","5/1","5/2","6/2","6/3"];

const HOUSES = [
  {v:"1", label:"1. Haus – Selbst & Identität"},
  {v:"2", label:"2. Haus – Werte & Ressourcen"},
  {v:"3", label:"3. Haus – Kommunikation & Lernen"},
  {v:"4", label:"4. Haus – Zuhause & Wurzeln"},
  {v:"5", label:"5. Haus – Freude, Kreativität & Spiel"},
  {v:"6", label:"6. Haus – Alltag & Gesundheit"},
  {v:"7", label:"7. Haus – Partnerschaft & Beziehungen"},
  {v:"8", label:"8. Haus – Transformation & Intimität"},
  {v:"9", label:"9. Haus – Sinn, Reisen & Philosophie"},
  {v:"10", label:"10. Haus – Berufung & Wirken nach außen"},
  {v:"11", label:"11. Haus – Gemeinschaft & Zukunftsvisionen"},
  {v:"12", label:"12. Haus – Rückzug & Innenwelt"}
];

/* ================= STATE ================= */
const state = {
  strategie:null, autoritaet:null, sakraltore:[], profil:null,
  sonne:null, sonneHaus:null, mond:null, mondHaus:null, venus:null, venusHaus:null,
  haus5:null, mars:null, marsHaus:null, mondknoten:null, mondknotenHaus:null,
  step:0
};

const STEPS = ["intro","strategie","autoritaet","sakraltore","profil","sonne","mond","venus","haus5","bonus","review"];

/* ================= RENDER HELPERS ================= */
function dots(current){
  // map step index to a visible progress within the 9 real question steps
  const questionSteps = STEPS.slice(1, STEPS.length-1); // exclude intro & review
  const idx = questionSteps.indexOf(STEPS[current]);
  if(idx < 0) return "";
  let html = '<div class="progress">';
  questionSteps.forEach((s,i)=>{
    let cls = "dot";
    if(i === idx) cls += " active";
    else if(i < idx) cls += " done";
    html += `<div class="${cls}"></div>`;
  });
  html += "</div>";
  return html;
}

function singleSelect(list, key, withEmoji=true){
  return `<div class="options">` + list.map(item=>{
    const val = item.v || item;
    const em = item.em ? `<span class="em">${item.em}</span>` : "";
    const selected = state[key] === val ? "selected" : "";
    return `<div class="opt ${selected}" onclick="selectOne('${key}', ${JSON.stringify(val).replace(/"/g,'&quot;')})">${em}<span>${val}</span></div>`;
  }).join("") + `</div>`;
}

function zodiacSelect(key){
  return `<select id="sel-${key}" onchange="selectOne('${key}', this.value)">
    <option value="">– bitte wählen –</option>
    ${ZODIAC.map(z=>`<option value="${z.v}" ${state[key]===z.v?"selected":""}>${z.em} ${z.v}</option>`).join("")}
  </select>`;
}

function houseSelect(key){
  return `<select id="sel-${key}" onchange="selectOne('${key}', this.value)">
    <option value="">– bitte wählen –</option>
    ${HOUSES.map(h=>`<option value="${h.v}" ${state[key]===h.v?"selected":""}>${h.label}</option>`).join("")}
  </select>`;
}

function selectOne(key, val){
  state[key] = val;
  render();
}

function toggleGate(val){
  const i = state.sakraltore.indexOf(val);
  if(i>-1) state.sakraltore.splice(i,1);
  else state.sakraltore.push(val);
  render();
}

/* ================= NAVIGATION ================= */
function canNext(){
  const s = STEPS[state.step];
  if(s==="intro") return true;
  if(s==="strategie") return !!state.strategie;
  if(s==="autoritaet") return !!state.autoritaet;
  if(s==="sakraltore") return state.sakraltore.length>0;
  if(s==="profil") return !!state.profil;
  if(s==="sonne") return !!state.sonne && !!state.sonneHaus;
  if(s==="mond") return !!state.mond && !!state.mondHaus;
  if(s==="venus") return !!state.venus && !!state.venusHaus;
  if(s==="haus5") return !!state.haus5;
  if(s==="bonus") return true;
  return true;
}

function next(){
  if(state.step < STEPS.length-1) state.step++;
  render();
}
function back(){
  if(state.step > 0) state.step--;
  render();
}
function skipBonus(){
  state.mars = null; state.marsHaus = null; state.mondknoten = null; state.mondknotenHaus = null;
  next();
}

/* ================= STEP CONTENT ================= */
function stepContent(){
  const s = STEPS[state.step];

  if(s==="intro"){
    return `
      <h2 class="step-title">Hey, schön, dass du da bist! 🌅</h2>
      <p class="step-sub">In ein paar kurzen Schritten frage ich deine Human-Design- und Astro-Placements ab –
      du kennst sie schon, also halt sie am besten bereit. Am Ende bekommst du deinen ganz persönlichen
      <strong>Freude-Code</strong>: wo dein Sakral am leichtesten Ja sagt, was dir wirklich Freude schenkt und
      wie du sie leichter leben kannst. Los geht's! ✨</p>
      <div class="btn-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" onclick="next()">Los geht's 💛</button>
      </div>`;
  }

  if(s==="strategie"){
    return `<h2 class="step-title">Bist du ein Generator? ⚡</h2>
      <p class="step-sub">KörperJa Freude-Code ist speziell für Generatorinnen gemacht.</p>
      ${singleSelect(STRATEGIEN, "strategie")}`;
  }

  if(s==="autoritaet"){
    return `<h2 class="step-title">Sakrale oder emotionale Autorität?</h2>
      <p class="step-sub">Als Generatorin hast du eine dieser beiden Autoritäten.</p>
      ${singleSelect(AUTORITAETEN, "autoritaet")}`;
  }

  if(s==="sakraltore"){
    return `<h2 class="step-title">Deine definierten Sakraltore</h2>
      <p class="step-sub">Wähle alle Tore aus, die bei dir definiert sind (Mehrfachauswahl möglich).</p>
      <div class="options">
      ${SAKRALTORE.map(g=>{
        const sel = state.sakraltore.includes(g.v) ? "selected" : "";
        return `<div class="opt ${sel}" onclick="toggleGate(${JSON.stringify(g.v).replace(/"/g,'&quot;')})">
          <span class="em">${sel?"✅":"⭕"}</span><span>${g.v}</span></div>`;
      }).join("")}
      </div>`;
  }

  if(s==="profil"){
    return `<h2 class="step-title">Dein Profil</h2>
      <p class="step-sub">Welche Profil-Kombination hast du?</p>
      <div class="grid-2">
      ${PROFILE.map(p=>{
        const sel = state.profil===p ? "selected" : "";
        return `<div class="opt ${sel}" style="justify-content:center;" onclick="selectOne('profil','${p}')">${p}</div>`;
      }).join("")}
      </div>`;
  }

  if(s==="sonne"){
    return `<h2 class="step-title">Deine Sonne</h2>
      <p class="step-sub">Astrologisch: dein Kern-Ausdruck – und der Lebensbereich, in dem er strahlt.</p>
      <span class="field-label">Sonnenzeichen</span>${zodiacSelect("sonne")}
      <div style="height:14px;"></div>
      <span class="field-label">Sonne im Haus</span>${houseSelect("sonneHaus")}`;
  }
  if(s==="mond"){
    return `<h2 class="step-title">Dein Mond</h2>
      <p class="step-sub">Deine emotionale Sicherheit &amp; dein Bedürfnis-Kompass – und wo sich das zeigt.</p>
      <span class="field-label">Mondzeichen</span>${zodiacSelect("mond")}
      <div style="height:14px;"></div>
      <span class="field-label">Mond im Haus</span>${houseSelect("mondHaus")}`;
  }
  if(s==="venus"){
    return `<h2 class="step-title">Deine Venus</h2>
      <p class="step-sub">Wie du liebst, genießt &amp; Schönheit erlebst – und in welchem Lebensbereich.</p>
      <span class="field-label">Venuszeichen</span>${zodiacSelect("venus")}
      <div style="height:14px;"></div>
      <span class="field-label">Venus im Haus</span>${houseSelect("venusHaus")}`;
  }
  if(s==="haus5"){
    return `<h2 class="step-title">Zeichen auf deinem 5. Haus</h2>
      <p class="step-sub">Dein Haus der Freude, Kreativität &amp; des Spiels.</p>
      <span class="field-label">Zeichen auf dem 5. Haus</span>${zodiacSelect("haus5")}`;
  }
  if(s==="bonus"){
    return `<h2 class="step-title">Bonus-Placements (optional)</h2>
      <p class="step-sub">Wenn du sie kennst: Mars &amp; Nördlicher Mondknoten machen deine Analyse noch feiner. Du kannst diesen Schritt auch überspringen.</p>
      <span class="field-label">Marszeichen</span>${zodiacSelect("mars")}
      <div style="height:8px;"></div>
      <span class="field-label">Mars im Haus</span>${houseSelect("marsHaus")}
      <div style="height:18px;"></div>
      <span class="field-label">Nördlicher Mondknoten – Zeichen</span>${zodiacSelect("mondknoten")}
      <div style="height:8px;"></div>
      <span class="field-label">Nördlicher Mondknoten im Haus</span>${houseSelect("mondknotenHaus")}`;
  }

  if(s==="review"){
    return `<h2 class="step-title">Alles bereit? 🌞</h2>
      <p class="step-sub">Ich webe jetzt deine Human-Design- und Astro-Placements zu deinem persönlichen Freude-Code zusammen.</p>
      <div class="section-card" style="font-size:13.5px; line-height:1.7;">
        <strong>Strategie:</strong> ${state.strategie}<br>
        <strong>Autorität:</strong> ${state.autoritaet}<br>
        <strong>Sakraltore:</strong> ${state.sakraltore.join(", ")}<br>
        <strong>Profil:</strong> ${state.profil}<br>
        <strong>Sonne:</strong> ${state.sonne} im ${state.sonneHaus}. Haus<br>
        <strong>Mond:</strong> ${state.mond} im ${state.mondHaus}. Haus<br>
        <strong>Venus:</strong> ${state.venus} im ${state.venusHaus}. Haus<br>
        <strong>5. Haus:</strong> ${state.haus5}<br>
        ${(state.mars||state.mondknoten) ? `<strong>Bonus:</strong> Mars ${state.mars||"–"}${state.marsHaus?` (${state.marsHaus}. Haus)`:""} · Mondknoten ${state.mondknoten||"–"}${state.mondknotenHaus?` (${state.mondknotenHaus}. Haus)`:""}` : ""}
      </div>
      <div class="btn-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" onclick="generateAnalysis()">Meinen Freude-Code enthüllen ✨</button>
      </div>`;
  }
}

function render(){

  const s = STEPS[state.step];
  const isReview = s === "review";
  const isIntro = s === "intro";

  let nav = "";
  if(!isReview && !isIntro){
    nav = `<div class="btn-row">
      <button class="btn btn-ghost" onclick="back()">← Zurück</button>
      ${s==="bonus" ? `<button class="btn btn-skip" onclick="skipBonus()">Überspringen</button>` : ""}
      <button class="btn btn-primary" ${canNext()?"":"disabled"} onclick="next()">Weiter →</button>

    nav = `<div class="btn-row" style="justify-content:flex-start;">

    </div>`;

  shell.innerHTML = dots(state.step) + stepContent() + (isReview ? nav : (isIntro? "" : nav));
}

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    let sseBuffer = "";
    const expectedChars = 3000 * 3.5; // grobe Schätzung (Tokens → Zeichen) für die Fortschrittsanzeige

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const lines = sseBuffer.split("\n");

    }

/* ================= PLAIN-TEXT FORMAT PARSER ================= */
function parseFreudeFormat(text){
  const markerRegex = /===\s*([A-ZÄÖÜ]+)\s*===/g;
  const matches = [...text.matchAll(markerRegex)];

  const result = {intro:"", sections:[], freude_codes:[], empfehlungen:[]};

  for(let i=0;i<matches.length;i++){
    const label = matches[i][1].toUpperCase();
    const start = matches[i].index + matches[i][0].length;
    const end = (i+1 < matches.length) ? matches[i+1].index : text.length;
    const block = text.slice(start, end).trim();
    if(!block) continue;

    if(label === "INTRO"){
      result.intro = block;
    } else if(label === "SECTION"){
      const emojiM = block.match(/EMOJI:\s*(.*)/i);
      const titelM = block.match(/TITEL:\s*(.*)/i);
      const textM = block.match(/TEXT:\s*([\s\S]*)/i);
      result.sections.push({
        emoji: emojiM ? emojiM[1].trim() : "✨",
        titel: titelM ? titelM[1].trim() : "",
        text: textM ? textM[1].trim() : block
      });
    } else if(label === "CODES"){
      result.freude_codes = block.split("\n").map(l=>l.replace(/^[-•]\s*/,"").trim()).filter(Boolean);
    } else if(label === "EMPFEHLUNGEN" || label === "EMPFEHLUNG"){
      result.empfehlungen = block.split("\n").map(l=>l.replace(/^[-•]\s*/,"").trim()).filter(Boolean);
    }
  }

  return result;
}

async function saveOrShare(){

  const originalLabel = btn ? btn.textContent : "";

  try{
    const canvas = await html2canvas(el, {backgroundColor:"#FFF6EC", scale:2, useCORS:true});
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
    showImageOverlay(canvas.toDataURL("image/png"));
  }catch(err){
    console.error("Speichern/Teilen-Fehler:", err);
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
    alert("Das hat leider nicht geklappt. Mach am besten einen Screenshot deines Ergebnisses.");
  }
}

function showImageOverlay(dataUrl){
  const overlay = document.createElement("div");
  overlay.className = "img-overlay";
  overlay.id = "img-overlay";
  overlay.onclick = (e) => { if(e.target === overlay) closeImageOverlay(); };
  overlay.innerHTML = `

  document.body.appendChild(overlay);
}

function closeImageOverlay(){
